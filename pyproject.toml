[project]
name = "obsidian-second-brain-fork"
version = "0.14.0"
description = "Hardened fork of obsidian-second-brain: vault synthesis with Bedrock-only model egress and a fail-closed pre-write gate"
requires-python = ">=3.10"
# Dependency set follows the strip (FORK_HARDENING.md). The research/eval
# stack is deleted, so its vendor SDKs are gone too: leaving openai,
# google-genai, google-api-python-client, youtube-transcript-api and feedparser
# declared here meant installing a "Bedrock-only" fork still pulled every
# vendor client it exists to avoid -- an egress posture contradicted by its own
# lockfile. boto3 is the single model-egress dependency (Bedrock).
dependencies = [
    "boto3>=1.34.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

# CI gates this exact set and nothing more. "F" is pyflakes: undefined names,
# unused imports, f-strings with no placeholders - the rules that catch bugs
# rather than opinions. "I" sorts imports. "PTH" prefers pathlib over os.path
# (#168), which is enforceable because the backlog was cleared first rather
# than silenced.
#
# Deliberately NOT gated:
#   E501  line length. A few hundred existing violations; line-length above
#         stays the formatting convention, not a build-breaking rule. No count
#         is quoted here on purpose - the last one drifted unnoticed. Run
#         `ruff check --select E501 --statistics .` for the current number.
#   E402  module-level import not at top. The sys.path shim these scripts use
#         to import siblings requires it.
#   E731  lambda assignment. Used intentionally in research/lib/config.py.
# Widening this list means fixing the backlog first, not adding a noqa sweep.
[tool.ruff.lint]
select = ["F", "I", "PTH"]

